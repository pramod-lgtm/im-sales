<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Intimissionline Sales</title>
  <meta name="description" content="Intimissionline field sales: call cards, PJP and target vs achievement.">
  <meta name="theme-color" content="#7a1f4b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IM Sales">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    html, body { margin: 0; height: 100%; background: #7a1f4b; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #faf6f8; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #7a1f4b; color: #fff; z-index: 5; text-align: center; padding: 24px; transition: opacity .3s; }
    #splash.gone { opacity: 0; pointer-events: none; }
    #splash img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
    #splash h1 { margin: 0; font-size: 22px; } #splash p { margin: 0; opacity: .85; font-size: 14px; }
    #slow { display: none; flex-direction: column; gap: 10px; margin-top: 10px; } #slow.show { display: flex; }
    .btn { appearance: none; border: 0; border-radius: 12px; padding: 11px 16px; font-weight: 700; font-size: 15px; cursor: pointer; text-decoration: none; text-align: center; }
    .btn.light { background: #fff; color: #7a1f4b; } .btn.outline { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.7); }
    #installbar { position: fixed; left: 8px; right: 8px; top: calc(8px + env(safe-area-inset-top)); z-index: 10; display: none; align-items: center; gap: 10px; background: #fff; color: #222; border-radius: 14px; padding: 10px 10px 10px 12px; box-shadow: 0 8px 30px rgba(0,0,0,.25); font-size: 14px; }
    #installbar.show { display: flex; }
    #installbar img { width: 36px; height: 36px; border-radius: 9px; } #installbar .txt { flex: 1; line-height: 1.3; }
    #installbar .btn { padding: 9px 12px; background: #7a1f4b; color: #fff; font-size: 14px; }
    #installbar .x { background: none; border: 0; font-size: 22px; color: #888; padding: 0 4px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/icon-192.png" alt="">
    <h1>Intimissionline Sales</h1>
    <p id="status">Loading…</p>
    <div id="slow">
      <p>Taking long? Check the internet, then try again.</p>
      <button class="btn light" id="retry">Try again</button>
      <a class="btn outline" id="openDirect" target="_blank" rel="noopener">Open in browser instead</a>
    </div>
  </div>
  <iframe id="app" title="Intimissionline Sales" allow="geolocation *; camera *; clipboard-write *; web-share *; fullscreen *" credentialless></iframe>
  <div id="installbar" role="dialog" aria-label="Install app">
    <img src="icons/icon-192.png" alt="">
    <div class="txt" id="installtxt"><b>Install IM Sales</b><br>Open it from your home screen like an app.</div>
    <button class="btn" id="installbtn">Install app</button>
    <button class="x" id="installx" aria-label="Close">×</button>
  </div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
