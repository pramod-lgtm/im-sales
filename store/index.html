.role-staff .wrap,.role-manager .wrap,.role-promoter .wrap{max-width:560px}

.loading{position:fixed;top:0;left:0;right:0;height:3px;z-index:99;background:linear-gradient(90deg,var(--brand),#f3a6c8,var(--brand));background-size:200% 100%;animation:ld 1s linear infinite}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:60;max-width:92vw;padding:11px 16px;border-radius:12px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.18)}

.linkbtn{background:none;border:0;padding:0;color:var(--brand);font-weight:600;cursor:pointer;text-decoration:underline;font-size:inherit}

.hl{border-color:#f6b3d6;background:#fff8fc}.low-t{color:var(--low);font-weight:600}.good-t{color:var(--good);font-weight:600}
.big-num{font-size:2rem;font-weight:800;color:var(--navy);line-height:1.1}

.li-main{display:flex;justify-content:space-between;gap:8px}

.storecard{border-left:5px solid var(--navy)}.storecard.bad{border-left-color:var(--low)}.storecard.ok{border-left-color:var(--good)}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.gallery img{width:100%;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:.86rem}table th{text-align:left;color:var(--muted);font-size:.72rem;text-transform:uppercase;padding:6px;border-bottom:2px solid var(--line)}table td{padding:6px;border-bottom:1px solid var(--line)}
.r{text-align:right}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

</style>

function helpMap() { var m = {}; (HELP || HELP_DEF).forEach(function (x) { m[x.key] = x; }); HELP_DEF.forEach(function (x) { if (!m[x.key]) m[x.key] = x; }); return m; }

  d.onclick = function (e) { if (e.target === d || e.target.hasAttribute('data-close') || e.target.closest('[data-go]')) d.remove(); }; document.body.appendChild(d); }); }
document.addEventListener('click', function (e) { var b = e.target.closest && e.target.closest('[data-help]'); if (b) { e.preventDefault(); e.stopPropagation(); showHelp(b.getAttribute('data-help')); } }, true);

function download(name, text) { var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
function copyText(text, btn) {
  var label = btn.textContent, done = function () { btn.textContent = '✓ Copied. Paste in WhatsApp'; setTimeout(function () { btn.textContent = label; }, 2500); };
  var fb = function () { var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-1000px'; document.body.appendChild(ta); ta.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove(); if (ok) done(); else toast('Copy blocked. Use "Open WhatsApp"', 'err'); };

function formData(form) { var o = {}; Array.prototype.forEach.call(form.elements, function (el) { if (!el.name || el.type === 'file') return; if ((el.type === 'radio' || el.type === 'checkbox') && !el.checked) return; o[el.name] = el.value; }); return o; }
function chips(name, list, sel, type) { return '<div class="chips">' + list.map(function (x) { var v = Array.isArray(x) ? x[0] : x, l = Array.isArray(x) ? x[1] : x; return '<label><input type="' + (type || 'radio') + '" name="' + name + '" value="' + h(v) + '"' + (String(v) === String(sel) ? ' checked' : '') + '><span>' + h(l) + '</span></label>'; }).join('') + '</div>'; }

// ---------- GPS ----------
function getGeo(el) {
  var box = el ? $(el) : null;
  if (box) box.innerHTML = '📍 Getting location…';
  return new Promise(function (res) {
    if (!navigator.geolocation) { if (box) box.innerHTML = '<span class="gpsbad">📍 GPS not available on this phone</span>'; return res(null); }
    navigator.geolocation.getCurrentPosition(function (p) { S.geo = { lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy) }; if (box) box.innerHTML = '📍 Location captured (±' + S.geo.acc + ' m)'; res(S.geo); },
      function () { if (box) { box.innerHTML = '<span class="gpsbad">📍 Location off. Turn on GPS and allow location.</span> <button type="button" class="linkbtn" id="' + el + '_r">Retry</button>'; $(el + '_r').onclick = function () { getGeo(el); }; } res(null); },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
  });
}
function geoData() { return S.geo ? { lat: S.geo.lat, lng: S.geo.lng } : {}; }

// ---------- camera: shrink to 1280 px, stamp date / time / store / GPS / name, upload, remember photo id ----------
var CAM = {};
function cam(id, type, label, opts) {
  opts = opts || {};
  return '<label class="cambtn' + (CAM[id] ? ' ok' : '') + '" id="cam_' + id + '"><input type="file" accept="image/*" capture="' + (type === 'selfie' ? 'user' : 'environment') + '" data-cam="' + id + '" data-type="' + type + '" data-slot="' + h(opts.slot || '') + '" data-store="' + (opts.store || '') + '"><span>📷 ' + h(label || 'Take photo') + '</span></label><img id="img_' + id + '" class="thumb hidden" alt="">';
}
function stampLines() { var st = S.stores.filter(function (s) { return s.id === Number(S.user.store_id); })[0]; return [dt(new Date().toISOString()) + '  ' + (st ? st.code : ''), S.user.name + (S.geo ? '  ' + S.geo.lat.toFixed(5) + ',' + S.geo.lng.toFixed(5) + ' ±' + S.geo.acc + 'm' : '  no GPS')]; }
document.addEventListener('change', function (e) {
  var inp = e.target; if (!inp.getAttribute || !inp.getAttribute('data-cam') || !inp.files || !inp.files[0]) return;
  var id = inp.getAttribute('data-cam'), box = $('cam_' + id), rd = new FileReader();
  box.classList.add('busy'); box.querySelector('span').textContent = '⏳ Saving photo…';
  rd.onload = function () {
    var img = new Image();
    img.onload = function () {
      var s = Math.min(1, 1280 / Math.max(img.width, img.height)), cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      var c = cv.getContext('2d'); c.drawImage(img, 0, 0, cv.width, cv.height);
      var fs = Math.max(14, Math.round(cv.width / 40)), lines = stampLines(); c.fillStyle = 'rgba(0,0,0,.55)'; c.fillRect(0, cv.height - fs * 2.8, cv.width, fs * 2.8);
      c.fillStyle = '#fff'; c.font = 'bold ' + fs + 'px sans-serif'; lines.forEach(function (l, i) { c.fillText(l, fs * 0.5, cv.height - fs * (1.7 - i * 1.15)); });
      var data = cv.toDataURL('image/jpeg', 0.72);
      call('uploadPhoto', Object.assign({ type: inp.getAttribute('data-type'), slot: inp.getAttribute('data-slot'), store_id: inp.getAttribute('data-store') || '', photo: data }, geoData())).then(function (r) {
        CAM[id] = r.id; box.classList.remove('busy'); box.classList.add('ok'); box.querySelector('span').textContent = '✓ Photo saved' + (r.outside ? ' (' + r.dist_m + ' m from store)' : '') + '. Tap to retake';
        var im = $('img_' + id); if (im) { im.src = data; im.classList.remove('hidden'); }
        if (inp.onphoto) inp.onphoto(r);
      }).catch(function (err) { box.classList.remove('busy'); box.querySelector('span').textContent = '📷 Try again'; fail(err); });
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(inp.files[0]);
});
function showPhoto(id, el) { if (!id) return; call('photo', { id: id }).then(function (r) { var x = $(el); if (!x) return; if (r.data) { x.src = r.data; x.classList.remove('hidden'); } else x.outerHTML = '<p class="small muted">' + h(r.error) + '</p>'; }).catch(function () {}); }

    var wire = function () { Array.prototype.forEach.call(document.querySelectorAll('[data-play]'), function (b) { b.onclick = function () { var k = b.getAttribute('data-play'), v = vids[k]; $('vf' + k).innerHTML = '<div style="position:relative;padding-top:56.25%;margin-top:8px"><iframe src="https://www.youtube-nocookie.com/embed/' + encodeURIComponent(v.yt) + '?autoplay=1&rel=0" style="position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:10px" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>'; b.remove(); }; }); };
    var card = function () { var c = m.cards[i];
      $app.innerHTML = head + '<div class="card"><p class="tiny muted">Card ' + (i + 1) + ' of ' + m.cards.length + '</p><h3>' + h(c.title) + '</h3><p>' + h(c.text) + '</p>' + (c.hint ? '<p class="small muted">💡 ' + h(c.hint) + '</p>' : '') + '</div>' +
        '<div class="btnrow">' + (i ? '<button id="pv">‹ Back</button>' : '') + (i < m.cards.length - 1 ? '<button class="primary" id="nx">Next ›</button>' : '') + '<button class="' + (i === m.cards.length - 1 ? 'primary' : '') + '" id="qz">Take quiz (' + m.quiz.length + ' Q)</button></div>' + vbox; wire();
      if ($('pv')) $('pv').onclick = function () { i--; card(); }; if ($('nx')) $('nx').onclick = function () { i++; card(); }; $('qz').onclick = quiz; window.scrollTo(0, 0); };
    var quiz = function () {
      $app.innerHTML = head + '<form id="qf">' + m.quiz.map(function (q, k) { return '<div class="card"><b>' + (k + 1) + '. ' + h(q.q) + '</b><div class="stack mt">' + q.o.map(function (o, j) { return '<label class="opt"><input type="radio" name="q' + q.id + '" value="' + j + '"> ' + h(o) + '</label>'; }).join('') + '</div><p class="small hidden" id="rv' + q.id + '"></p></div>'; }).join('') +
        '<button class="primary block big">Submit quiz</button></form>'; window.scrollTo(0, 0);
      $('qf').onsubmit = function (e) { e.preventDefault(); var d = formData(e.target), ans = {}, miss = 0; m.quiz.forEach(function (q) { ans[q.id] = d['q' + q.id]; if (d['q' + q.id] == null) miss++; });
        if (miss && !confirm(miss + ' question(s) not answered. Submit anyway?')) return;
        var b = e.target.querySelector('button.primary'); b.disabled = true;
        call('submitQuiz', { no: m.no, answers: ans }).then(function (r) {
          r.review.forEach(function (x) { var q = m.quiz.filter(function (y) { return y.id === x.id; })[0], el = $('rv' + x.id); el.classList.remove('hidden'); el.innerHTML = x.got === x.right ? '<b class="good">✓ Correct.</b> ' + h(x.explain) : '<b class="low">✗ Answer: ' + h(q.o[x.right]) + '.</b> ' + h(x.explain); });
          b.outerHTML = '<div class="card ' + (r.pass ? 'hl' : '') + '"><h3>' + (r.pass ? '🏅 Passed! ' : 'Not passed yet. ') + r.score_pct + '% (' + r.correct + '/' + r.total + ')</h3><p class="small muted">Pass mark ' + r.pass_pct + '%. Attempt ' + r.attempts + '.' + (r.pass ? '' : ' Read the answers above and try again.') + '</p><div class="btnrow">' + (r.pass ? '' : '<button class="primary" id="rt">Retake quiz</button>') + '<button data-go="/training">My Training</button></div></div>';
          toast(r.pass ? 'Passed: ' + r.score_pct + '%' : 'Score ' + r.score_pct + '%. Try again.', r.pass ? 'ok' : 'err'); if ($('rt')) $('rt').onclick = quiz;
        }).catch(function (err) { b.disabled = false; fail(err); }); };
    };
    if (m.cards.length) card(); else quiz();
  });
}, 'training');
on(/^\/training-team$/, function () {
  var sid = q('store') || '';
  return call('teamTraining', { store_id: sid }).then(function (r) {
    $app.innerHTML = '<h2>🎓 Team training</h2>' + (S.stores.length > 1 ? '<div class="filters"><label>Store<select id="tsp">' + opt([['', 'All stores']].concat(S.stores.map(function (s) { return [s.id, s.name]; })), sid) + '</select></label></div>' : '') +
      '<div class="card"><ul class="list">' + (r.rows.length ? r.rows.map(function (u) { var pend = r.modules.filter(function (m) { return !(u.by[m.no] || {}).passed; });
        return '<li><span><b>' + h(u.name) + '</b><br><span class="small muted">' + h(u.role) + ' · ' + h(u.store || '') + (u.level ? ' · ' + h(u.level) : '') + '</span>' + (pend.length ? '<br><span class="tiny muted">Pending: ' + pend.map(function (m) { var x = u.by[m.no]; return m.no + (x.attempts ? ' (' + x.best + '%)' : ''); }).join(', ') + '</span>' : '') + '</span><span class="pill ' + cls(u.pct) + '">' + (u.done === u.total ? '🏅 ' : '') + u.done + '/' + u.total + '</span></li>'; }).join('') : empty('No team members')) + '</ul></div>' +
      '<p class="tiny muted">Modules: ' + r.modules.map(function (m) { return m.no + '. ' + h(m.title); }).join(' · ') + '</p>';
    if ($('tsp')) $('tsp').onchange = function () { go('/training-team?store=' + $('tsp').value); };
  });
}, 'training_team');
on(/^\/phase2$/, function () {
  return call('phase2').then(function (r) {
    $app.innerHTML = '<h2>🎓 Coming in Phase 2</h2><div class="card hl"><p class="small" style="margin:0">Training, quiz and weekly challenges are planned for Phase 2. The Sheet already has the Training, Quiz and Challenges tabs, so content can be added now.</p></div>' +
      '<h4 class="sec">Training modules</h4><div class="card"><ul class="list">' + r.training.map(function (t) { return '<li><span>' + h(t.module) + ': ' + h(t.lesson) + '</span><span class="tag">' + t.minutes + ' min</span></li>'; }).join('') + '</ul></div>' +
      '<h4 class="sec">Challenges</h4><div class="card"><ul class="list">' + r.challenges.map(function (c) { return '<li><span>' + h(c.name) + '<br><span class="small muted">' + dLabel(c.start_date) + ' to ' + dLabel(c.end_date) + ' · ' + h(c.prize) + '</span></span><span class="tag">soon</span></li>'; }).join('') + '</ul></div><p class="small muted">Quiz questions in the Sheet: ' + r.quiz + '</p>';
  });
}, 'phase2');

// ---------- start ----------
function applyBoot(r) { S.user = r.user; S.perms = r.perms; S.stores = r.stores; S.today = r.today; S.lists = r.lists; S.lang = r.lang || 'en'; S.multi = !!r.speed; }
function startScreen() { if (!location.hash || /^#\/?(login)?$/.test(location.hash)) go(S.user.role === 'owner' || S.user.role === 'auditor' ? '/dashboard' : '/home'); else route(); }
/** Opens at once from the last saved login data on this phone, then checks with the server in the background. */
function boot() {
  try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf('imc:') === 0 || k === 'imc_boot') localStorage.removeItem(k); }); } catch (e) { /* ignore */ }
  var saved = null; try { saved = JSON.parse(store.getItem(BOOT_KEY) || 'null'); } catch (e) { saved = null; }
  if (saved && saved.token === S.token && saved.d) {
    applyBoot(saved.d); startScreen();
    callNet('boot', {}, 0).then(function (r) { var changed = JSON.stringify(r) !== JSON.stringify(saved.d); store.setItem(BOOT_KEY, JSON.stringify({ token: S.token, d: r })); applyBoot(r); if (changed) route(); }).catch(function (e) { if (!S.token) return; if (/sign in/i.test(e.message || '')) signOutLocal(); });
    return Promise.resolve();
  }
  return callNet('boot', {}, 0).then(function (r) { try { store.setItem(BOOT_KEY, JSON.stringify({ token: S.token, d: r })); } catch (e) { /* ignore */ } applyBoot(r); startScreen(); });
}
S.token = store.getItem('ims_token');
bridgeAsk().then(function (t) {
  if (!S.token && t) { S.token = t; store.setItem('ims_token', t); }
  else if (S.token && BRIDGE.origin && t !== S.token) bridgeSave(S.token);
  if (S.token) boot().catch(function () { signOutLocal(); }); else go('/login');
});
})();
</script>
<script>/* Service worker: check for a new version on every open / return to the app; when a new one takes over, reload once so old and new screens never mix. */
if ('serviceWorker' in navigator) { var hadCtrl = !!navigator.serviceWorker.controller, reloaded = false;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) { reg.update(); document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') reg.update(); }); }).catch(function () {});
  navigator.serviceWorker.addEventListener('controllerchange', function () { if (!hadCtrl || reloaded) return; reloaded = true; location.reload(); }); }</script>
