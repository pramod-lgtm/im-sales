<!DOCTYPE html>
<html lang="en-IN">

<title>IM Store</title>
  <meta charset="utf-8">

  <style>
:root{--brand:#3d3f94;--brand2:#e91e8c;--navy:#3d3f94;--pink:#e91e8c;--ink:#1d1a22;--muted:#6f6876;--line:#ebe6ee;--bg:#f7f5f9;--card:#fff;--good:#1f8a5b;--mid:#c98a12;--low:#c4384b;--radius:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;overscroll-behavior-y:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45}
a{color:var(--brand)}
h2{font-size:1.3rem;margin:.2rem 0 .6rem}h3{font-size:1.02rem;margin:0 0 .6rem}h4.sec{margin:.8rem 0 .3rem;font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.wrap{max-width:1240px;margin:0 auto;padding:14px 14px 96px}
.role-admin .wrap{padding-bottom:40px;max-width:1400px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 14px;background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 2px 10px rgba(60,10,40,.18)}
.brand{display:flex;align-items:center;gap:9px;color:#fff;text-decoration:none}
.brand small{display:block;font-size:.72rem;opacity:.85;line-height:1}
.brand b{display:block;line-height:1.1}
.logo{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#fff;color:var(--brand);font-weight:800;font-size:.85rem;letter-spacing:.02em}
.logo.lg{width:58px;height:58px;font-size:1.3rem;border-radius:16px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.adminnav{display:flex;gap:4px;flex:1;overflow-x:auto}
.adminnav a{color:#fff;text-decoration:none;padding:7px 11px;border-radius:9px;opacity:.85;white-space:nowrap;font-size:.92rem}
.adminnav a.on,.adminnav a:hover{background:rgba(255,255,255,.18);opacity:1}
.who{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:.88rem}
.who .ghost{color:#fff;border-color:rgba(255,255,255,.45);background:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(30,10,40,.04)}
.narrow{max-width:460px}
.center{text-align:center}
.muted{color:var(--muted)}.small{font-size:.82rem}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.wrap-gap{flex-wrap:wrap}
.mt{margin-top:10px}
.hidden{display:none!important}
.sr{position:absolute;left:-9999px;width:1px;height:1px}
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:600;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 14px;cursor:pointer;text-decoration:none}
.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.primary:active{filter:brightness(.92)}
.ghost{background:#fff}
.danger{background:#fff;border-color:#f0c2c9;color:var(--low)}
.sm{padding:6px 10px;font-size:.84rem;border-radius:9px}
.block{width:100%}.big{padding:15px;font-size:1.05rem}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
form.inline{display:inline}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid #ddd5e2;border-radius:11px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #f6b3d6;border-color:var(--brand2)}
input[type=radio]{width:auto}
label{display:block;font-size:.85rem;color:var(--muted);font-weight:500}
label>input,label>select,label>textarea{margin-top:4px;color:var(--ink)}
.stack>*+*{margin-top:12px}
fieldset{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px 12px;margin:12px 0 0;background:#fff}
legend{font-weight:700;font-size:.9rem;padding:0 6px}
fieldset .grid2+.grid2,fieldset .grid2+label{margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
details summary{cursor:pointer;font-weight:600;color:var(--brand);padding:4px 0}
details[open] summary{margin-bottom:8px}
.seg{display:flex;gap:6px;margin-top:4px}
.seg label{flex:1;margin:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:10px 6px;border:1px solid #ddd5e2;border-radius:11px;background:#fff;color:var(--ink);font-weight:600;font-size:.9rem}
.seg input:checked+span{background:#fde8f3;border-color:var(--brand);color:var(--brand)}
.pinfo{min-height:1em}.due{color:var(--low);font-weight:600}
.newp{background:#fff8ec;border:1px dashed #e8c98a;border-radius:12px;padding:8px 10px}
.flash{padding:11px 13px;border-radius:12px;margin-bottom:12px;font-weight:500}
.flash.ok{background:#e8f6ef;color:#145c3d;border:1px solid #bfe5d2}
.flash.err{background:#fdecee;color:#8a1f2e;border:1px solid #f4c4cb}
code{background:#f3eef6;padding:1px 6px;border-radius:6px}code.big{font-size:1.1rem}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.card .kpis{margin-bottom:10px}
.kpis.three{grid-template-columns:repeat(3,1fr)}.kpis.four{grid-template-columns:repeat(4,1fr)}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.card .kpi{background:#faf8fb}
.kpi span{display:block;font-size:.76rem;color:var(--muted)}
.kpi b{display:block;font-size:1.12rem;margin-top:2px}
.kpi small{display:block;color:var(--muted);font-size:.76rem;margin-top:2px}
.hello{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hello h2{margin:0}.hello p{margin:0}
.progress{margin:8px 0 12px}
.progress-head,.progress-foot{display:flex;justify-content:space-between;font-size:.86rem}
.progress-foot{color:var(--muted);font-size:.78rem;margin-top:3px}
.track{height:11px;background:#efe9f2;border-radius:99px;overflow:hidden;margin-top:4px}
.fill{height:100%;border-radius:99px;transition:width .4s}
.fill.good{background:var(--good)}.fill.mid{background:var(--mid)}.fill.low{background:var(--low)}
b.good{color:var(--good)}b.mid{color:var(--mid)}b.low{color:var(--low)}b.none{color:var(--muted);font-weight:500}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-weight:700;font-size:.8rem}
.pill.good{background:#e3f4ec;color:var(--good)}.pill.mid{background:#fbf0d9;color:#8f600a}.pill.low{background:#fbe5e8;color:var(--low)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list li>a:not(.btn){text-decoration:none;color:inherit;flex:1}
.list li>.btn{flex:none}
.list li.done b{color:var(--good)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:#f1ecf4;color:var(--muted)}
.tag.ok{background:#e3f4ec;color:var(--good)}.tag.off{background:#fbe5e8;color:var(--low)}.tag.new{background:#fff1d6;color:#8f600a}.tag.demo{background:#fff1d6;color:#8f600a}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);padding:8px;border-bottom:2px solid var(--line);white-space:nowrap;background:#faf8fb}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl .r{text-align:right;white-space:nowrap}
.tbl tr.total td{font-weight:700;background:#faf6fb;border-top:2px solid var(--line)}
.tbl tr.inactive td{opacity:.55}
.tbl tr.overdue td{background:#fff6f7}
.tbl tr.hl td{background:#fde8f3}
.tbl tr.grp td{border-top:2px solid #e2d8e8}
.tbl td.bad{color:var(--low);font-weight:700}
.tbl input.num{width:120px;text-align:right;padding:6px 8px;font-size:.9rem}
.tbl input.cell{padding:6px 8px;font-size:.9rem;min-width:130px}
.nowrap{white-space:nowrap}.clip{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filters,.inline-filters{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:12px}
.filters label,.inline-filters label{min-width:140px}
.filters input,.filters select,.inline-filters input,.inline-filters select{padding:8px 10px;font-size:.92rem}
.search{margin-bottom:10px}
.details{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;margin:12px 0}
.details dt{color:var(--muted);font-size:.85rem}.details dd{margin:0}
.details .amt{font-weight:700}.pre{white-space:pre-wrap}
.photo{max-width:100%;border-radius:12px;margin-top:10px;border:1px solid var(--line)}
.back{display:inline-block;margin-bottom:8px;text-decoration:none}
pre.wa{white-space:pre-wrap;background:#effae9;border:1px solid #d3ecc6;padding:12px;border-radius:12px;font-size:.85rem;font-family:inherit}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,#e3e4f7,transparent 50%),radial-gradient(circle at 80% 90%,#fbdcee,transparent 50%),var(--bg)}
.anon .wrap{padding:0;max-width:none}
.login-card{width:100%;max-width:380px;background:#fff;border-radius:20px;padding:26px 22px;box-shadow:0 12px 40px rgba(80,20,60,.12)}
.login-brand{text-align:center;margin-bottom:18px}
.login-brand h1{margin:10px 0 0;font-size:1.45rem}.login-brand p{margin:2px 0 0;color:var(--muted)}
.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(30,10,40,.06)}
.bottomnav a{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--muted);font-size:.7rem;font-weight:600;gap:1px;padding:4px 0}
.bottomnav a span{font-size:1.15rem;line-height:1.2}
.bottomnav a.on{color:var(--brand)}
.bottomnav a.cta span{background:var(--pink)!important;display:grid;place-items:center;width:42px;height:42px;margin-top:-18px;border-radius:50%;background:var(--brand);color:#fff;font-size:1.4rem;box-shadow:0 4px 12px rgba(233,30,140,.35)}
.role-staff .wrap,.role-manager .wrap,.role-promoter .wrap{max-width:560px}
@media (max-width:860px){.kpis.four{grid-template-columns:repeat(2,1fr)}.grid-2col,.grid3{grid-template-columns:1fr 1fr}.adminnav{order:3;width:100%}.topbar{flex-wrap:wrap}.hide-sm{display:none}}
@media (max-width:520px){.grid-2col,.grid3{grid-template-columns:1fr}.kpis.three{grid-template-columns:repeat(3,1fr)}.kpis.three .kpi b{font-size:.98rem}.details{grid-template-columns:110px 1fr}}
.loading{position:fixed;top:0;left:0;right:0;height:3px;z-index:99;background:linear-gradient(90deg,var(--brand),#f3a6c8,var(--brand));background-size:200% 100%;animation:ld 1s linear infinite}
@keyframes ld{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:60;max-width:92vw;padding:11px 16px;border-radius:12px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.toast.ok{background:#145c3d;color:#fff}.toast.err{background:#8a1f2e;color:#fff}
.gpsbad{color:var(--low)}
.modal{position:fixed;inset:0;background:rgba(20,10,20,.45);display:grid;place-items:center;z-index:70;padding:16px}
.modal .card{max-width:440px;width:100%}
.linkbtn{background:none;border:0;padding:0;color:var(--brand);font-weight:600;cursor:pointer;text-decoration:underline;font-size:inherit}

.primary{background:var(--pink);border-color:var(--pink)}.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:86px;padding:10px 6px;background:#fff;border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.86rem;text-align:center;position:relative}
.tile span{font-size:1.6rem;line-height:1}.tile small{font-weight:500;color:var(--muted);font-size:.7rem}
.tile.done{border-color:#bfe5d2;background:#f3fbf7}.tile.todo{border-color:#f6b3d6;background:#fff5fa}.tile.late{border-color:#f4c4cb;background:#fdecee}
.tile .dot{position:absolute;top:6px;right:8px;min-width:20px;height:20px;border-radius:99px;background:var(--pink);color:#fff;font-size:.72rem;display:grid;place-items:center;padding:0 5px}
.statusrow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.cambtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border:2px dashed #c9c3e6;border-radius:12px;background:#f7f7fd;color:var(--navy);font-weight:700;font-size:.95rem;cursor:pointer;padding:8px}
.cambtn.ok{border-style:solid;border-color:var(--good);background:#eefaf3;color:var(--good)}
.cambtn.busy{opacity:.6}.cambtn input{display:none}
.thumb{width:100%;max-height:220px;object-fit:cover;border-radius:10px;margin-top:6px;border:1px solid var(--line)}
.tbar{height:8px;background:#eee;border-radius:99px;overflow:hidden}.tbar i{display:block;height:100%;background:var(--good)}
.opt{display:block;padding:10px;border:1px solid var(--line);border-radius:10px;margin:4px 0;font-weight:500}
.chk{border-bottom:1px solid var(--line);padding:10px 0}.chk:last-child{border-bottom:0}
.chk .q{font-weight:600}.chk .hi{display:block;font-weight:500;color:var(--muted);font-size:.82rem}
.yn{display:flex;gap:8px;margin-top:6px}.yn label{flex:1;margin:0}.yn input{position:absolute;opacity:0}
.yn span{display:block;text-align:center;padding:12px 6px;border:1px solid #ddd5e2;border-radius:11px;font-weight:700;color:var(--ink)}
.yn input:checked+span.y{background:#e3f4ec;border-color:var(--good);color:var(--good)}.yn input:checked+span.n{background:#fbe5e8;border-color:var(--low);color:var(--low)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.chips label{margin:0}.chips input{position:absolute;opacity:0}
.chips span{display:inline-block;padding:9px 12px;border:1px solid #ddd5e2;border-radius:99px;font-weight:600;color:var(--ink);font-size:.9rem;background:#fff}
.chips input:checked+span{background:var(--navy);border-color:var(--navy);color:#fff}
.hl{border-color:#f6b3d6;background:#fff8fc}.low-t{color:var(--low);font-weight:600}.good-t{color:var(--good);font-weight:600}
.big-num{font-size:2rem;font-weight:800;color:var(--navy);line-height:1.1}
.rank{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.rank .no{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#eef;color:var(--navy);font-weight:800}
.rank.me{background:#fff5fa;border-radius:10px;padding:9px 6px}
.up{color:var(--good)}.down{color:var(--low)}
.li-main{display:flex;justify-content:space-between;gap:8px}
.tiny{font-size:.72rem}.sec-title{display:flex;justify-content:space-between;align-items:center}
.storecard{border-left:5px solid var(--navy)}.storecard.bad{border-left-color:var(--low)}.storecard.ok{border-left-color:var(--good)}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.gallery img{width:100%;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:.86rem}table th{text-align:left;color:var(--muted);font-size:.72rem;text-transform:uppercase;padding:6px;border-bottom:2px solid var(--line)}table td{padding:6px;border-bottom:1px solid var(--line)}
.r{text-align:right}
</style>
</head>

    var row = function (x, sub) { return '<tr' + (sub ? ' class="small"' : '') + '><td>' + (sub ? '&nbsp;&nbsp;↳ ' : '<b>') + h(x.name) + (sub ? '' : '</b>') + '</td>' + (c.masked ? '' : '<td class="r">' + rs(x.mtd) + '</td><td class="r">' + rs(x.lm) + '</td><td class="r">' + (c.lyItems ? rs(x.ly) : '-') + '</td>') + '<td class="r">' + (x.share == null ? '-' : x.share + '%') + '</td><td class="r">' + x.units + '</td><td class="r">' + sg(x.gLm) + '</td><td class="r">' + (c.lyItems ? sg(x.gLy) : '-') + '</td></tr>'; };
    var html = '<h2>🗂️ Category sales</h2><div class="filters">' + (r.stores ? '<label>Store<select id="cst2">' + opt(r.stores.map(function (s) { return [s.id, s.name]; }), r.store_id) + '</select></label>' : '') +
      (r.team ? '<label>Person<select id="cus">' + opt([['', 'Whole store']].concat(r.team.map(function (u) { return [u.id, u.name]; })), r.user_id) + '</select></label>' : '') + '<label>Date<input type="date" id="cdt" value="' + r.date + '" max="' + S.today + '"></label></div>' +
      '<p class="small muted">' + h(r.store) + (r.person ? ' · ' + h(r.person) : '') + ' · Month to date ' + dLabel(c.from) + ' to ' + dLabel(c.to) + ' vs same days last month (' + dLabel(c.lm.from) + ' to ' + dLabel(c.lm.to) + ') and last year.' + (c.masked ? ' Shown in % only.' : '') + '</p>';
    html += '<div class="kpis">' + (c.masked ? '' : kpi('Sales MTD', rs(c.total.mtd), 'last month ' + rs(c.total.lm))) + kpi('vs last month', sg(c.total.gLm)) + kpi('vs LY', sg(c.total.gLy), c.lyNote || 'like for like') + (r.storeTotal ? kpi('Store vs last month', sg(r.storeTotal.gLm), 'store vs LY ' + (r.storeTotal.gLy == null ? '-' : (r.storeTotal.gLy > 0 ? '+' : '') + r.storeTotal.gLy + '%')) : '') + '</div>';
    if (c.lyNote) html += '<p class="small muted">ℹ️ ' + h(c.lyNote) + ' Load last year with the item-wise import (Store performance → Imports).</p>';
    html += c.groups.length ? '<div class="card" style="overflow:auto"><table><tr><th>Group / sub group</th>' + (c.masked ? '' : '<th class="r">MTD</th><th class="r">Last month</th><th class="r">LY</th>') + '<th class="r">Share</th><th class="r">Pcs</th><th class="r">vs LM</th><th class="r">vs LY</th></tr>' +
      c.groups.map(function (g) { return row(g) + g.subs.map(function (x) { return row(x, true); }).join(''); }).join('') + '</table></div>' : '<div class="card">' + empty('No item-wise sales for this period yet. Import the Fusion item-wise report.') + '</div>';
    if (r.people && r.people.length) html += '<h4 class="sec">Team category mix (share % of own sales)</h4><div class="card"><ul class="list">' + r.people.map(function (u) { return '<li data-go="/categories?date=' + r.date + '&store=' + r.store_id + '&user=' + u.id + '" style="cursor:pointer"><span><b>' + h(u.name) + '</b><br><span class="small muted">' + (u.mix.length ? u.mix.map(function (m) { return h(m.name) + ' ' + m.share + '%' + (m.gLm != null ? ' (' + (m.gLm > 0 ? '+' : '') + m.gLm + '%)' : ''); }).join(' · ') : 'no item sales') + '</span></span><span class="small">LM ' + sg(u.gLm) + '<br>LY ' + (u.gLy == null ? '<span class="tiny muted">no LY</span>' : sg(u.gLy)) + '</span></li>'; }).join('') + '</ul></div>';
    $app.innerHTML = html;
    var nav = function () { go('/categories?date=' + $('cdt').value + ($('cst2') ? '&store=' + $('cst2').value : '') + ($('cus') && $('cus').value ? '&user=' + $('cus').value : '')); };
    $('cdt').onchange = nav; if ($('cst2')) $('cst2').onchange = function () { if ($('cus')) $('cus').value = ''; nav(); }; if ($('cus')) $('cus').onchange = nav;
  });
}, 'perf');
// ---------- training ----------
on(/^\/training$/, function () {
  return call('myTraining').then(function (r) {
    var st = r.status;
    $app.innerHTML = '<h2>🎓 ' + T('My Training', 'मेरी ट्रेनिंग') + '</h2><div class="card"><div class="row-between"><b>' + st.done + ' of ' + st.total + ' modules passed</b><span class="pill ' + cls(st.pct) + '">' + st.pct + '%</span></div><div class="tbar mt"><i style="width:' + st.pct + '%"></i></div>' +
      (st.done === st.total && st.total ? '<p class="good mt"><b>🏅 All training complete. Well done, ' + h(r.name) + '!</b></p>' : '<p class="small muted mt">Read the cards, then take the quiz. Pass mark 80%. You can retake any time.</p>') + '</div>' +
      (r.levels || [{ level: 1, name: 'Modules', open: true, done: st.done, total: st.total, complete: false, modules: r.modules.map(function (m) { return m.no; }) }]).map(function (L) {
        var ms = r.modules.filter(function (m) { return L.modules.indexOf(m.no) >= 0; });
        return '<h4 class="sec">' + (L.complete ? '🏅 ' : L.open ? '' : '🔒 ') + h(L.name) + ' <span class="small muted">' + L.done + '/' + L.total + '</span></h4>' + (L.open ? '' : '<p class="small muted">Opens when all modules of the previous level are passed.</p>') + '<div class="card"><ul class="list">' + ms.map(function (m) { var x = st.by[m.no] || {};
        return '<li' + (L.open ? ' data-go="/training/' + m.no + '" style="cursor:pointer"' : ' style="opacity:.55"') + '><span><b>' + m.no + '. ' + h(m.title) + '</b><br><span class="small muted">' + h(m.title_hi || '') + ' · ' + m.cards + ' cards, ' + m.questions + ' questions' + (x.attempts ? ' · best ' + x.best + '%, ' + x.attempts + ' attempt(s)' : '') + '</span></span>' +
          (x.passed ? '<span class="pill good">🏅 Passed ' + dLabel(x.passed) + '</span>' : !L.open ? '<span class="pill none">🔒</span>' : '<span class="pill ' + (x.attempts ? 'low' : 'none') + '">' + (x.attempts ? 'Retake' : 'Start') + '</span>') + '</li>'; }).join('') + '</ul></div>'; }).join('') +
      (can('training_team') ? '<button class="block" data-go="/training-team">Team training progress</button>' : '');
  });
}, 'training');
on(/^\/training\/(\d+)$/, function (no) {
  return call('trainingModule', { no: no }).then(function (m) {
    var i = 0, st = m.status || {};
    var vids = m.videos || [], vbox = vids.length ? '<div class="card"><b>🎬 Watch (' + vids.length + ')</b><ul class="list">' + vids.map(function (v, k) { return '<li><span>' + h(v.title) + '<br><span class="small muted">' + h(v.source) + ' · ' + h(v.language) + '</span><div id="vf' + k + '"></div></span><span class="btnrow" style="flex-wrap:nowrap">' + (v.yt ? '<button class="sm" data-play="' + k + '">▶ Play</button>' : '') + '<a class="sm" href="' + h(v.url) + '" target="_blank" rel="noopener">YouTube ↗</a></span></li>'; }).join('') + '</ul></div>' : '';
    var head = '<h2>🎓 ' + m.no + '. ' + h(m.title) + '</h2>' + (st.passed ? '<div class="card hl"><b>🏅 Certificate: passed on ' + dLabel(st.passed) + ' (best ' + st.best + '%)</b></div>' : '');
    var wire = function () { Array.prototype.forEach.call(document.querySelectorAll('[data-play]'), function (b) { b.onclick = function () { var k = b.getAttribute('data-play'), v = vids[k]; $('vf' + k).innerHTML = '<div style="position:relative;padding-top:56.25%;margin-top:8px"><iframe src="https://www.youtube-nocookie.com/embed/' + encodeURIComponent(v.yt) + '?autoplay=1&rel=0" style="position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:10px" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>'; b.remove(); }; }); };
    var card = function () { var c = m.cards[i];
      $app.innerHTML = head + '<div class="card"><p class="tiny muted">Card ' + (i + 1) + ' of ' + m.cards.length + '</p><h3>' + h(c.title) + '</h3><p>' + h(c.text) + '</p>' + (c.hint ? '<p class="small muted">💡 ' + h(c.hint) + '</p>' : '') + '</div>' +
        '<div class="btnrow">' + (i ? '<button id="pv">‹ Back</button>' : '') + (i < m.cards.length - 1 ? '<button class="primary" id="nx">Next ›</button>' : '') + '<button class="' + (i === m.cards.length - 1 ? 'primary' : '') + '" id="qz">Take quiz (' + m.quiz.length + ' Q)</button></div>' + vbox; wire();
      if ($('pv')) $('pv').onclick = function () { i--; card(); }; if ($('nx')) $('nx').onclick = function () { i++; card(); }; $('qz').onclick = quiz; window.scrollTo(0, 0); };
    var quiz = function () {
      $app.innerHTML = head + '<form id="qf">' + m.quiz.map(function (q, k) { return '<div class="card"><b>' + (k + 1) + '. ' + h(q.q) + '</b><div class="stack mt">' + q.o.map(function (o, j) { return '<label class="opt"><input type="radio" name="q' + q.id + '" value="' + j + '"> ' + h(o) + '</label>'; }).join('') + '</div><p class="small hidden" id="rv' + q.id + '"></p></div>'; }).join('') +
        '<button class="primary block big">Submit quiz</button></form>'; window.scrollTo(0, 0);
      $('qf').onsubmit = function (e) { e.preventDefault(); var d = formData(e.target), ans = {}, miss = 0; m.quiz.forEach(function (q) { ans[q.id] = d['q' + q.id]; if (d['q' + q.id] == null) miss++; });
        if (miss && !confirm(miss + ' question(s) not answered. Submit anyway?')) return;
        var b = e.target.querySelector('button.primary'); b.disabled = true;
        call('submitQuiz', { no: m.no, answers: ans }).then(function (r) {
          r.review.forEach(function (x) { var q = m.quiz.filter(function (y) { return y.id === x.id; })[0], el = $('rv' + x.id); el.classList.remove('hidden'); el.innerHTML = x.got === x.right ? '<b class="good">✓ Correct.</b> ' + h(x.explain) : '<b class="low">✗ Answer: ' + h(q.o[x.right]) + '.</b> ' + h(x.explain); });
          b.outerHTML = '<div class="card ' + (r.pass ? 'hl' : '') + '"><h3>' + (r.pass ? '🏅 Passed! ' : 'Not passed yet. ') + r.score_pct + '% (' + r.correct + '/' + r.total + ')</h3><p class="small muted">Pass mark ' + r.pass_pct + '%. Attempt ' + r.attempts + '.' + (r.pass ? '' : ' Read the answers above and try again.') + '</p><div class="btnrow">' + (r.pass ? '' : '<button class="primary" id="rt">Retake quiz</button>') + '<button data-go="/training">My Training</button></div></div>';
          toast(r.pass ? 'Passed: ' + r.score_pct + '%' : 'Score ' + r.score_pct + '%. Try again.', r.pass ? 'ok' : 'err'); if ($('rt')) $('rt').onclick = quiz;
        }).catch(function (err) { b.disabled = false; fail(err); }); };
    };
    if (m.cards.length) card(); else quiz();
  });
}, 'training');
on(/^\/training-team$/, function () {
  var sid = q('store') || '';
  return call('teamTraining', { store_id: sid }).then(function (r) {
    $app.innerHTML = '<h2>🎓 Team training</h2>' + (S.stores.length > 1 ? '<div class="filters"><label>Store<select id="tsp">' + opt([['', 'All stores']].concat(S.stores.map(function (s) { return [s.id, s.name]; })), sid) + '</select></label></div>' : '') +
      '<div class="card"><ul class="list">' + (r.rows.length ? r.rows.map(function (u) { var pend = r.modules.filter(function (m) { return !(u.by[m.no] || {}).passed; });
        return '<li><span><b>' + h(u.name) + '</b><br><span class="small muted">' + h(u.role) + ' · ' + h(u.store || '') + (u.level ? ' · ' + h(u.level) : '') + '</span>' + (pend.length ? '<br><span class="tiny muted">Pending: ' + pend.map(function (m) { var x = u.by[m.no]; return m.no + (x.attempts ? ' (' + x.best + '%)' : ''); }).join(', ') + '</span>' : '') + '</span><span class="pill ' + cls(u.pct) + '">' + (u.done === u.total ? '🏅 ' : '') + u.done + '/' + u.total + '</span></li>'; }).join('') : empty('No team members')) + '</ul></div>' +
      '<p class="tiny muted">Modules: ' + r.modules.map(function (m) { return m.no + '. ' + h(m.title); }).join(' · ') + '</p>';
    if ($('tsp')) $('tsp').onchange = function () { go('/training-team?store=' + $('tsp').value); };
  });
}, 'training_team');
on(/^\/phase2$/, function () {
  return call('phase2').then(function (r) {
    $app.innerHTML = '<h2>🎓 Coming in Phase 2</h2><div class="card hl"><p class="small" style="margin:0">Training, quiz and weekly challenges are planned for Phase 2. The Sheet already has the Training, Quiz and Challenges tabs, so content can be added now.</p></div>' +
      '<h4 class="sec">Training modules</h4><div class="card"><ul class="list">' + r.training.map(function (t) { return '<li><span>' + h(t.module) + ': ' + h(t.lesson) + '</span><span class="tag">' + t.minutes + ' min</span></li>'; }).join('') + '</ul></div>' +
      '<h4 class="sec">Challenges</h4><div class="card"><ul class="list">' + r.challenges.map(function (c) { return '<li><span>' + h(c.name) + '<br><span class="small muted">' + dLabel(c.start_date) + ' to ' + dLabel(c.end_date) + ' · ' + h(c.prize) + '</span></span><span class="tag">soon</span></li>'; }).join('') + '</ul></div><p class="small muted">Quiz questions in the Sheet: ' + r.quiz + '</p>';
  });
}, 'phase2');

// ---------- start ----------
function boot() {
  return call('boot').then(function (r) {
    S.user = r.user; S.perms = r.perms; S.stores = r.stores; S.today = r.today; S.lists = r.lists; S.lang = r.lang || 'en';
    if (!location.hash || /^#\/?(login)?$/.test(location.hash)) go(S.user.role === 'owner' || S.user.role === 'auditor' ? '/dashboard' : '/home'); else route();
  });
}
S.token = store.getItem('ims_token');
bridgeAsk().then(function (t) {
  if (!S.token && t) { S.token = t; store.setItem('ims_token', t); }
  else if (S.token && BRIDGE.origin && t !== S.token) bridgeSave(S.token);
  if (S.token) boot().catch(function () { signOutLocal(); }); else go('/login');
});
})();
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');</script>
</body>
